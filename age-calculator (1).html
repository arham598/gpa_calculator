<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator — Student Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3A2E;
    --board-deep:#182F25;
    --wood:#8B5E3C;
    --wood-dark:#6E4A2D;
    --chalk:#F5F3EA;
    --chalk-dim:#C9D3C6;
    --chalk-yellow:#F2C14E;
    --chalk-pink:#E88DA0;
    --chalk-blue:#8FC1E3;
    --line: rgba(245,243,234,0.16);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2A4A3A 0%, transparent 60%),
      var(--board-deep);
    font-family:'Inter',sans-serif;
    color:var(--chalk);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
  }
  .frame{
    width:100%;
    max-width:560px;
    background:linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
    border-radius:18px;
    padding:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .board{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%), var(--board);
    border-radius:10px;
    padding:34px 30px 30px;
    position:relative;
  }
  nav.tool-nav{
    display:flex;
    gap:14px;
    margin-bottom:22px;
    font-size:0.8rem;
  }
  nav.tool-nav a{
    color:var(--chalk-dim);
    text-decoration:none;
    padding-bottom:2px;
    border-bottom:1px solid transparent;
  }
  nav.tool-nav a:hover, nav.tool-nav a:focus-visible{
    color:var(--chalk-yellow);
    border-bottom-color:var(--chalk-yellow);
  }
  header{
    margin-bottom:22px;
    border-bottom:1px dashed var(--line);
    padding-bottom:18px;
  }
  h1{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:2.6rem;
    margin:0;
    color:var(--chalk);
    line-height:1;
  }
  .subtitle{
    font-size:0.85rem;
    color:var(--chalk-dim);
    margin:6px 0 0;
  }
  .field{
    margin-bottom:18px;
  }
  label{
    display:block;
    font-size:0.78rem;
    color:var(--chalk-dim);
    margin-bottom:6px;
  }
  input[type="date"]{
    width:100%;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    padding:10px 12px;
    color-scheme: dark;
  }
  input:focus-visible{
    outline:2px solid var(--chalk-blue);
    outline-offset:2px;
  }
  .calc-btn{
    appearance:none;
    background:var(--chalk-yellow);
    color:var(--board-deep);
    border:none;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    padding:11px 20px;
    cursor:pointer;
    width:100%;
  }
  .calc-btn:hover{ filter:brightness(1.05); }
  .result-strip{
    margin-top:28px;
    padding-top:22px;
    border-top:1px dashed var(--line);
  }
  .result-caption{
    font-size:0.75rem;
    color:var(--chalk-dim);
  }
  .result-value{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:2.4rem;
    color:var(--chalk-yellow);
    line-height:1.2;
    margin:6px 0 0;
  }
  .breakdown{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-top:18px;
  }
  .breakdown div{
    background:rgba(0,0,0,0.2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    text-align:center;
  }
  .breakdown .num{
    font-size:1.3rem;
    font-weight:700;
    color:var(--chalk-blue);
  }
  .breakdown .lbl{
    font-size:0.68rem;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  .next-bday{
    margin-top:16px;
    font-size:0.82rem;
    color:var(--chalk-dim);
  }
  .next-bday strong{ color:var(--chalk-pink); }
  @media (max-width: 480px){
    h1{ font-size:2.1rem; }
    .board{ padding:26px 16px 22px; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="board">
    <nav class="tool-nav">
      <a href="index.html">GPA Calculator</a>
      <a href="age-calculator.html">Age Calculator</a>
    </nav>
    <header>
      <h1>Age Calculator</h1>
      <p class="subtitle">Find your exact age in years, months and days</p>
    </header>

    <div class="field">
      <label for="dob">Your date of birth</label>
      <input type="date" id="dob">
    </div>

    <button type="button" class="calc-btn" id="calcBtn">Calculate age</button>

    <div class="result-strip" id="resultStrip" style="display:none;">
      <span class="result-caption">You are</span>
      <p class="result-value" id="resultHeadline">–</p>
      <div class="breakdown">
        <div><div class="num" id="totalDays">–</div><div class="lbl">days lived</div></div>
        <div><div class="num" id="totalWeeks">–</div><div class="lbl">weeks lived</div></div>
        <div><div class="num" id="totalMonths">–</div><div class="lbl">months lived</div></div>
      </div>
      <p class="next-bday" id="nextBday"></p>
    </div>
  </div>
</div>

<script>
  const dobInput = document.getElementById('dob');
  const calcBtn = document.getElementById('calcBtn');
  const resultStrip = document.getElementById('resultStrip');
  const resultHeadline = document.getElementById('resultHeadline');
  const totalDays = document.getElementById('totalDays');
  const totalWeeks = document.getElementById('totalWeeks');
  const totalMonths = document.getElementById('totalMonths');
  const nextBday = document.getElementById('nextBday');

  calcBtn.addEventListener('click', () => {
    if(!dobInput.value) return;
    const dob = new Date(dobInput.value);
    const today = new Date();
    if(dob > today) {
      resultHeadline.textContent = "that date hasn't happened yet!";
      resultStrip.style.display = 'block';
      totalDays.textContent = '–';
      totalWeeks.textContent = '–';
      totalMonths.textContent = '–';
      nextBday.textContent = '';
      return;
    }

    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();

    if(days < 0){
      months -= 1;
      const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if(months < 0){
      years -= 1;
      months += 12;
    }

    resultHeadline.textContent = `${years} years, ${months} months, ${days} days`;

    const msDiff = today - dob;
    const dayCount = Math.floor(msDiff / (1000 * 60 * 60 * 24));
    totalDays.textContent = dayCount.toLocaleString();
    totalWeeks.textContent = Math.floor(dayCount / 7).toLocaleString();
    totalMonths.textContent = (years * 12 + months).toLocaleString();

    let nextBirthday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
    if(nextBirthday < today){
      nextBirthday = new Date(today.getFullYear() + 1, dob.getMonth(), dob.getDate());
    }
    const daysToGo = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));
    nextBday.innerHTML = daysToGo === 0
      ? `<strong>🎉 Happy Birthday today!</strong>`
      : `Next birthday in <strong>${daysToGo} days</strong>`;

    resultStrip.style.display = 'block';
  });
</script>
</body>
</html>
